name: Snapshot live specs

# Fetches the live endpoints in sources.json and commits a new dated version of any document that changed,
# so the live sources build up their own base/revision history over time.

on:
  schedule:
    - cron: "17 5 * * 1" # weekly
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: snapshot
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Fetch live endpoints
        run: python tools/fetch.py snapshot

      - name: Commit changes
        run: |
          if [ -z "$(git status --porcelain)" ]; then echo "No changes." | tee -a "$GITHUB_STEP_SUMMARY"; exit 0; fi
          git status --short | tee -a "$GITHUB_STEP_SUMMARY"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A specs manifest.json pairs.json
          git commit -m "Snapshot live specs $(date -u +%F)"
          git push
